name: PocketServer build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      sign-android:
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.0'
  APP_DIR: apps/pocketserver_flutter

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history for exposed secrets
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          work="$(mktemp -d "$RUNNER_TEMP/pocketserver-scan.XXXXXX")"
          trap 'rm -rf -- "$work"' EXIT
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive" \
            --output "$work/$archive"
          (cd "$work" && printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check)
          tar -xzf "$work/$archive" -C "$work" gitleaks
          "$work/gitleaks" git --redact=100 --no-banner --log-opts='--all' .

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Verify shared contracts
        working-directory: packages/contracts
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Verify Flutter app
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build APK and app bundle
        working-directory: ${{ env.APP_DIR }}
        env:
          SIGN_ANDROID: ${{ inputs.sign-android || false }}
          ANDROID_KEYSTORE_BASE64: ${{ inputs.sign-android && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          POCKETSERVER_STORE_PASSWORD: ${{ inputs.sign-android && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          POCKETSERVER_KEY_ALIAS: ${{ inputs.sign-android && secrets.ANDROID_KEY_ALIAS || '' }}
          POCKETSERVER_KEY_PASSWORD: ${{ inputs.sign-android && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          if [[ "$SIGN_ANDROID" == true ]]; then
            : "${ANDROID_KEYSTORE_BASE64:?Android keystore secret is required}"
            : "${POCKETSERVER_STORE_PASSWORD:?Android keystore password is required}"
            : "${POCKETSERVER_KEY_ALIAS:?Android key alias is required}"
            : "${POCKETSERVER_KEY_PASSWORD:?Android key password is required}"
            umask 077
            POCKETSERVER_STORE_FILE="$(mktemp "$RUNNER_TEMP/pocketserver-signing.XXXXXX")"
            export POCKETSERVER_STORE_FILE
            trap 'rm -f -- "$POCKETSERVER_STORE_FILE"' EXIT
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$POCKETSERVER_STORE_FILE"
            unset ANDROID_KEYSTORE_BASE64
          fi
          flutter build apk --release
          flutter build appbundle --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/PocketServer-Android.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/PocketServer-Android.aab
          cp FLUTTER_TEMPLATE_LICENSE.txt dist/
          cd dist
          sha256sum PocketServer-Android.apk PocketServer-Android.aab > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PocketServer-Android
          path: ${{ env.APP_DIR }}/dist/
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Verify shared contracts
        working-directory: packages/contracts
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dart pub get
          dart analyze
          dart test
      - name: Verify and build Flutter app
        working-directory: ${{ env.APP_DIR }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          flutter pub get
          flutter analyze
          flutter test
          flutter build windows --release
      - name: Build installer and portable archive
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseDir = Join-Path $PWD "$env:APP_DIR/build/windows/x64/runner/Release"
          $dist = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Path $dist | Out-Null
          Copy-Item "$env:APP_DIR/FLUTTER_TEMPLATE_LICENSE.txt" $releaseDir
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "$dist/PocketServer-Windows-x64.zip"
          $inno = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (!(Test-Path $inno)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $versionLine = Get-Content "$env:APP_DIR/pubspec.yaml" | Select-String '^version: ([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$'
          if (!$versionLine) { throw 'Expected an app version in MAJOR.MINOR.PATCH+BUILD form.' }
          $version = $versionLine.Matches[0].Groups[1].Value
          & $inno "/DAppSource=$releaseDir" "/DAppVersion=$version" "/O$dist" packaging/windows/PocketServer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem $dist -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content "$dist/SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: PocketServer-Windows-x64
          path: dist/
          if-no-files-found: error
