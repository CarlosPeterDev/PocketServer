name: Build PocketServer

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "test/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  APP: PocketServer

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Create platform project
        run: |
          flutter create --platforms=android --org dev.carlospeter --project-name pocketserver .
          rm -rf test
          python3 tool/patch_platforms.py android
      - run: flutter pub get
      - name: Add Stop button to the service notification
        run: python3 tool/patch_bg_service.py
      - run: dart run flutter_launcher_icons -f tool/icons/android.yaml
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK and AAB (same code, same permissions)
        run: |
          flutter build apk --release --build-number ${{ github.run_number }}
          flutter build appbundle --release --build-number ${{ github.run_number }}
          mkdir out
          cp build/app/outputs/flutter-apk/app-release.apk out/${APP}-android.apk
          cp build/app/outputs/bundle/release/app-release.aab out/${APP}-android.aab
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/* }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - name: Create platform project
        run: |
          flutter create --platforms=linux --org dev.carlospeter --project-name pocketserver .
          rm -rf test
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package (tar.gz + deb)
        run: |
          B=build/linux/x64/release/bundle
          mkdir out
          tar -czf out/${APP}-linux-x64.tar.gz -C $B .
          D=deb/pocketserver
          mkdir -p $D/DEBIAN $D/opt/pocketserver $D/usr/bin $D/usr/share/applications
          cp -r $B/. $D/opt/pocketserver/
          ln -s /opt/pocketserver/pocketserver $D/usr/bin/pocketserver
          cat > $D/DEBIAN/control <<CTL
          Package: pocketserver
          Version: 1.0.${{ github.run_number }}
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0
          Maintainer: Carlos <noreply@example.com>
          Description: PocketServer - file hub with web UI, FTP and FTPS servers
          CTL
          sed -i 's/^ *//' $D/DEBIAN/control
          cat > $D/usr/share/applications/pocketserver.desktop <<DSK
          [Desktop Entry]
          Name=PocketServer
          Exec=/opt/pocketserver/pocketserver
          Type=Application
          Categories=Network;FileTransfer;
          DSK
          sed -i 's/^ *//' $D/usr/share/applications/pocketserver.desktop
          dpkg-deb --build $D out/${APP}-linux-amd64.deb
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: out/* }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Create platform project
        shell: bash
        run: |
          flutter create --platforms=windows --org dev.carlospeter --project-name pocketserver .
          rm -rf test
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f tool/icons/windows.yaml
      - run: flutter build windows --release
      - name: Package (zip + installer)
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "out/$env:APP-windows-x64.zip"
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=1.0.${{ github.run_number }}" tool\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/* }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Create platform project
        run: |
          flutter create --platforms=macos --org dev.carlospeter --project-name pocketserver .
          rm -rf test
          python3 tool/patch_platforms.py macos
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f tool/icons/macos.yaml
      - run: flutter build macos --release
      - name: Package (zip + dmg)
        run: |
          mkdir out
          APPDIR=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          ditto -c -k --keepParent "$APPDIR" out/${APP}-macos.zip
          hdiutil create -volname "$APP" -srcfolder "$APPDIR" -ov -format UDZO out/${APP}-macos.dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: out/* }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter config --no-enable-swift-package-manager
      - name: Create platform project
        run: |
          flutter create --platforms=ios --org dev.carlospeter --project-name pocketserver .
          rm -rf test
          python3 tool/patch_platforms.py ios
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f tool/icons/ios.yaml
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p out Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr out/${APP}-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: out/* }

  android-smoke:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: android, path: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tool/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-smoke, path: smoke/* }

  release:
    needs: [android, linux, windows, macos, ios]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PocketServer build ${{ github.run_number }}
          files: dist/*
          body: |
            Android APK / AAB, Windows, macOS, Linux and (unsigned) iOS builds.
            iOS IPA is unsigned: sign it with your own certificate (AltStore / Sideloadly / Xcode) to install.
