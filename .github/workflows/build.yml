name: Build InfinityShare

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP: InfinityShare

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Create platform project
        run: |
          flutter create --platforms=android --org dev.carlospeter --project-name infinityshare .
          rm -rf test
          python3 tool/patch_platforms.py android
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APKs (universal + per-ABI)
        run: |
          flutter build apk --release --build-number ${{ github.run_number }}
          flutter build apk --release --split-per-abi --build-number ${{ github.run_number }}
      - name: Build AAB
        run: flutter build appbundle --release --build-number ${{ github.run_number }}
      - name: Collect
        run: |
          mkdir out
          cp build/app/outputs/flutter-apk/app-release.apk out/${APP}-android.apk
          for a in arm64-v8a armeabi-v7a x86_64; do
            cp build/app/outputs/flutter-apk/app-$a-release.apk out/${APP}-android-$a.apk
          done
          cp build/app/outputs/bundle/release/app-release.aab out/${APP}-android.aab
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/* }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - name: Create platform project
        run: |
          flutter create --platforms=linux --org dev.carlospeter --project-name infinityshare .
          rm -rf test
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package (tar.gz + deb)
        run: |
          B=build/linux/x64/release/bundle
          mkdir out
          tar -czf out/${APP}-linux-x64.tar.gz -C $B .
          D=deb/infinityshare
          mkdir -p $D/DEBIAN $D/opt/infinityshare $D/usr/bin $D/usr/share/applications
          cp -r $B/. $D/opt/infinityshare/
          ln -s /opt/infinityshare/infinityshare $D/usr/bin/infinityshare
          cat > $D/DEBIAN/control <<CTL
          Package: infinityshare
          Version: 1.0.${{ github.run_number }}
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0
          Maintainer: Carlos <noreply@example.com>
          Description: InfinityShare - file hub with web UI, FTP and FTPS servers
          CTL
          sed -i 's/^ *//' $D/DEBIAN/control
          cat > $D/usr/share/applications/infinityshare.desktop <<DSK
          [Desktop Entry]
          Name=InfinityShare
          Exec=/opt/infinityshare/infinityshare
          Type=Application
          Categories=Network;FileTransfer;
          DSK
          sed -i 's/^ *//' $D/usr/share/applications/infinityshare.desktop
          dpkg-deb --build $D out/${APP}-linux-amd64.deb
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: out/* }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Create platform project
        shell: bash
        run: |
          flutter create --platforms=windows --org dev.carlospeter --project-name infinityshare .
          rm -rf test
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "out/$env:APP-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/* }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Create platform project
        run: |
          flutter create --platforms=macos --org dev.carlospeter --project-name infinityshare .
          rm -rf test
          python3 tool/patch_platforms.py macos
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package (zip + dmg)
        run: |
          mkdir out
          APPDIR=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          ditto -c -k --keepParent "$APPDIR" out/${APP}-macos.zip
          hdiutil create -volname "$APP" -srcfolder "$APPDIR" -ov -format UDZO out/${APP}-macos.dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: out/* }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Create platform project
        run: |
          flutter create --platforms=ios --org dev.carlospeter --project-name infinityshare .
          rm -rf test
          python3 tool/patch_platforms.py ios
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p out Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr out/${APP}-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: out/* }

  release:
    needs: [android, linux, windows, macos, ios]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: InfinityShare build ${{ github.run_number }}
          files: dist/*
          body: |
            Android APK / AAB, Windows, macOS, Linux and (unsigned) iOS builds.
            iOS IPA is unsigned: sign it with your own certificate (AltStore / Sideloadly / Xcode) to install.
