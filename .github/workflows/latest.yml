name: Publish verified main build

on:
  workflow_run:
    workflows: [PocketServer build]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish-latest:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: pocketserver-main-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: PocketServer-Android
          path: artifacts/android
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: PocketServer-Windows-x64
          path: artifacts/windows
      - name: Publish direct downloads
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          (cd artifacts/android && sha256sum --check SHA256SUMS.txt)
          (cd artifacts/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo "A newer main commit is available. Leaving Latest unchanged."
            exit 0
          fi
          tag="build-${SOURCE_RUN_NUMBER}-${SOURCE_SHA:0:7}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This verified build already has a release."
            exit 0
          fi
          cp artifacts/android/SHA256SUMS.txt Android-SHA256SUMS.txt
          cp artifacts/windows/SHA256SUMS.txt Windows-SHA256SUMS.txt
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --latest \
            --title "PocketServer build $SOURCE_RUN_NUMBER" \
            --notes "Development build from commit $SOURCE_SHA. Android packages use CI test signing." \
            artifacts/android/PocketServer-Android.apk \
            artifacts/android/PocketServer-Android.aab \
            artifacts/windows/PocketServer-Setup-x64.exe \
            artifacts/windows/PocketServer-Windows-x64.zip \
            Android-SHA256SUMS.txt Windows-SHA256SUMS.txt \
            artifacts/android/FLUTTER_TEMPLATE_LICENSE.txt
