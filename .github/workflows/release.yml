name: Publish a versioned PocketServer release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketserver-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the version tag and changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a tag in vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/\1/p' apps/pocketserver_flutter/pubspec.yaml)"
          if [[ "v$version" != "$RELEASE_TAG" ]]; then
            echo "The tag must match the app version." >&2
            exit 1
          fi
          if ! grep -Fxq "## $RELEASE_TAG" CHANGELOG.md; then
            echo "Add a versioned changelog section before publishing." >&2
            exit 1
          fi

  build:
    needs: verify-version
    uses: ./.github/workflows/build.yml
    with:
      sign-android: true
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PocketServer-Android
          path: artifacts/android
      - uses: actions/download-artifact@v4
        with:
          name: PocketServer-Windows-x64
          path: artifacts/windows
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd artifacts/android && sha256sum -c SHA256SUMS.txt)
          (cd artifacts/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          awk -v heading="## $RELEASE_TAG" '
            $0 == heading { active = 1; next }
            active && /^## / { exit }
            active { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "Release notes are empty." >&2
            exit 1
          fi
          cp artifacts/android/SHA256SUMS.txt Android-SHA256SUMS.txt
          cp artifacts/windows/SHA256SUMS.txt Windows-SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --verify-tag --title "PocketServer $RELEASE_TAG" \
            --notes-file release-notes.md \
            artifacts/android/PocketServer-Android.apk \
            artifacts/android/PocketServer-Android.aab \
            artifacts/windows/PocketServer-Windows-x64.zip \
            artifacts/windows/PocketServer-Setup-x64.exe \
            Android-SHA256SUMS.txt Windows-SHA256SUMS.txt \
            artifacts/android/FLUTTER_TEMPLATE_LICENSE.txt
